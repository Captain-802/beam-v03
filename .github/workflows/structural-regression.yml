name: Structural regression checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check engineering regressions and committed distribution
        run: node --test tests/*.test.cjs
      - name: Rebuild standalone calculator
        shell: pwsh
        run: ./build-single-html.ps1
      - name: Verify reproducible distribution
        run: git diff --exit-code -- dist/beam-design-single.html
